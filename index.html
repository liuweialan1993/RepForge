<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101311">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RepForge">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>RepForge — Workout log</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">R</span><span>REPFORGE</span></div>
      <button class="icon-button" id="settingsButton" aria-label="Settings">···</button>
    </header>

    <section class="screen active" id="homeScreen">
      <div class="greeting"><p class="eyebrow" id="todayDate"></p><h1>Ready when<br>you are.</h1></div>
      <div class="start-card">
        <div class="card-topline"><span class="live-dot"></span><span>YOUR NEXT SESSION</span></div>
        <h2 id="nextWorkoutName">Choose a workout</h2>
        <p id="nextWorkoutMeta">Your training, your pace.</p>
        <button class="primary-button" id="startWorkoutButton">Start workout <span>↗</span></button>
      </div>
      <div class="section-heading"><div><p class="eyebrow">MADE FOR YOU</p><h2>Your workouts</h2></div><button class="text-button" id="addWorkoutButton">＋ New</button></div>
      <div id="workoutList" class="workout-list"></div>
      <div class="home-footer"><span class="tiny-dot"></span> Your log stays on this device</div>
    </section>

    <section class="screen" id="sessionScreen">
      <div class="session-header"><button class="back-button" id="endWorkoutButton">← <span>Finish</span></button><div class="session-tools"><button class="unit-toggle" id="unitToggle" aria-label="Switch weight units">LB</button><div class="session-clock" id="sessionClock">00:00</div><button class="icon-button small" id="sessionMenuButton">···</button></div></div>
      <div class="session-title"><p class="eyebrow">WORKOUT IN PROGRESS</p><h1 id="sessionWorkoutName"></h1><p id="sessionProgress"></p><div id="restBar" class="rest-bar" hidden><div class="rest-info"><span class="rest-pulse"></span><span>REST</span><strong id="restClock">00:45</strong></div><div class="rest-track"><span id="restFill"></span></div><button id="skipRestButton">Skip ↗</button></div></div>
      <div id="exerciseList" class="exercise-list"></div>
      <button class="add-exercise-button" id="addExerciseButton">＋ Add exercise</button>
      <div class="session-bottom"><button class="finish-button" id="finishWorkoutButton">Finish workout <span>✓</span></button></div>
    </section>

    <section class="screen" id="historyScreen">
      <div class="greeting"><p class="eyebrow">YOUR WORK, OVER TIME</p><h1>Training<br>history.</h1></div>
      <div id="historyList" class="history-list"></div>
    </section>

    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab active" data-screen="homeScreen"><span class="tab-icon">⌂</span>Home</button>
      <button class="tab" data-screen="historyScreen"><span class="tab-icon">◷</span>History</button>
    </nav>
  </main>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
